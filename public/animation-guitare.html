<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La main : avec métronome et batterie</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; margin: 0; padding: 24px 16px; background: #fff; color: #222; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
  p.sub { margin: 0 0 12px; color: #666; font-size: 15px; }
  svg.board { width: 100%; height: auto; display: block; }
  .finger { fill: #efd3bf; stroke: #8a6652; stroke-width: 1.5; transition: fill 0.3s ease, filter 0.3s ease, stroke 0.3s ease; }
  .finger.lit { fill: var(--c); filter: drop-shadow(0 0 10px var(--c)); animation: pulse 1.1s ease-in-out infinite; }
  .finger.held { fill: #CECBF6; stroke: #534AB7; stroke-width: 3; }
  .rhythm .finger { transition: fill 0.08s ease, filter 0.08s ease, stroke 0.08s ease; }
  @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 5px var(--c)); } 50% { filter: drop-shadow(0 0 16px var(--c)); } }
  #dot, #dot1 { transition: opacity 0.25s ease; }
  #step { font-size: 14px; color: #666; margin-top: 10px; }
  #caption { min-height: 56px; margin: 4px 0 14px; font-size: 20px; font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .modes { display: flex; gap: 0; margin-bottom: 10px; flex-wrap: wrap; }
  .modes button { border-radius: 0; margin-left: -1px; }
  .modes button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .modes button:last-child { border-radius: 0 8px 8px 0; }
  .modes button.active, #adv.active { background: #534AB7; color: #fff; }
  button { font: inherit; font-size: 16px; padding: 10px 20px; border: 1px solid #534AB7; background: #fff; color: #534AB7; border-radius: 8px; cursor: pointer; }
  button:hover { background: #EEEDFE; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: #fff; }
  .modes button.active:hover, #adv.active:hover { background: #3C3489; }
  button.main { background: #534AB7; color: #fff; }
  button.main:hover { background: #3C3489; }
  .panel { border: 1px solid #d8d6ce; border-radius: 12px; padding: 14px; margin: 0 0 14px; }
  .lbl { font-size: 14px; color: #666; margin: 0 0 6px; }
  .notes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .notes button { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 8px 12px; min-width: 88px; line-height: 1.2; }
  .notes button svg { width: 28px; height: 28px; }
  .notes button small { font-size: 12px; opacity: 0.85; }
  .notes button.active { background: #534AB7; color: #fff; }
  .notes button.active:hover { background: #3C3489; }
  .tempo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .tempo input[type=range] { flex: 1 1 160px; min-width: 140px; accent-color: #534AB7; }
  .tempo button { padding: 6px 14px; }
  #bpmv { min-width: 74px; font-weight: 600; }
  .pips { display: flex; gap: 6px; align-items: flex-end; margin: 12px 0 10px; flex-wrap: wrap; }
  .pip { display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #bbb; color: #777; box-sizing: border-box; }
  .pip.b { width: 32px; height: 32px; font-size: 15px; font-weight: 600; }
  .pip.o { width: 24px; height: 24px; font-size: 12px; }
  .pip.on { background: #534AB7; border-color: #534AB7; color: #fff; }
  .pip.on.first { background: #0F6E56; border-color: #0F6E56; }
  #rinfo { font-size: 15px; color: #444; margin-bottom: 12px; min-height: 22px; }
  @media (prefers-reduced-motion: reduce) { .finger.lit { animation: none; } }
</style>
</head>
<body>
<main id="app">
  <h1>Quel doigt joue ?</h1>
  <p class="sub">Main gauche, paume visible : le pouce est à gauche, l'index à gauche des doigts. Manche vu du joueur : corde 6 en haut.</p>

  <div class="modes" role="group" aria-label="Sens du mouvement">
    <button id="m-forward" type="button" aria-pressed="false">À l'endroit</button>
    <button id="m-reverse" type="button" aria-pressed="false">À l'envers</button>
    <button id="m-both" type="button" aria-pressed="true" class="active">Aller-retour</button>
  </div>
  <div class="row">
    <button id="adv" type="button" aria-pressed="false">Mode avancé : le doigt 1 reste posé</button>
  </div>

  <svg class="board" viewBox="0 0 640 520" role="img" aria-label="Un manche de guitare au-dessus d'une main gauche. Le doigt qui doit jouer s'allume sur la main et la case correspondante s'allume sur le manche. Le changement de doigt suit le rythme du métronome ou de la batterie.">
    <g font-size="14" fill="#666" text-anchor="middle">
      <text x="135" y="34">Case 1</text>
      <text x="265" y="34">Case 2</text>
      <text x="395" y="34">Case 3</text>
      <text x="525" y="34">Case 4</text>
    </g>

    <rect x="70" y="48" width="520" height="124" fill="#f4f1ea" stroke="#999" stroke-width="1"/>
    <line x1="200" y1="48" x2="200" y2="172" stroke="#999" stroke-width="2"/>
    <line x1="330" y1="48" x2="330" y2="172" stroke="#999" stroke-width="2"/>
    <line x1="460" y1="48" x2="460" y2="172" stroke="#999" stroke-width="2"/>
    <line x1="590" y1="48" x2="590" y2="172" stroke="#999" stroke-width="2"/>
    <line x1="70" y1="48" x2="70" y2="172" stroke="#222" stroke-width="7"/>

    <line id="s0" x1="70" y1="60" x2="590" y2="60" stroke="#444" stroke-width="2.6"/>
    <line id="s1" x1="70" y1="80" x2="590" y2="80" stroke="#444" stroke-width="2.2"/>
    <line id="s2" x1="70" y1="100" x2="590" y2="100" stroke="#444" stroke-width="1.8"/>
    <line x1="70" y1="120" x2="590" y2="120" stroke="#aaa" stroke-width="1.3"/>
    <line x1="70" y1="140" x2="590" y2="140" stroke="#aaa" stroke-width="1"/>
    <line x1="70" y1="160" x2="590" y2="160" stroke="#aaa" stroke-width="0.8"/>

    <g font-size="14" text-anchor="middle" dominant-baseline="central">
      <text x="42" y="60" font-weight="600" fill="#222">6</text>
      <text x="42" y="80" font-weight="600" fill="#222">5</text>
      <text x="42" y="100" font-weight="600" fill="#222">4</text>
      <text x="42" y="120" fill="#999">3</text>
      <text x="42" y="140" fill="#999">2</text>
      <text x="42" y="160" fill="#999">1</text>
    </g>

    <g fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3">
      <circle cx="304" cy="60" r="11"/><circle cx="304" cy="80" r="11"/><circle cx="304" cy="100" r="11"/>
      <circle cx="564" cy="60" r="11"/><circle cx="564" cy="80" r="11"/><circle cx="564" cy="100" r="11"/>
    </g>

    <g id="dot1" style="opacity:0">
      <circle cx="0" cy="0" r="9.5" fill="#534AB7"/>
      <text x="0" y="0" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
    </g>

    <g id="dot" style="opacity:0">
      <circle id="dc" cx="0" cy="0" r="9.5" fill="#534AB7"/>
      <text id="dt" x="0" y="0" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
    </g>

    <rect x="250" y="450" width="142" height="70" fill="#efd3bf" stroke="#8a6652" stroke-width="1.5"/>

    <g transform="translate(228,405) rotate(-35)">
      <rect x="-44" y="-105" width="44" height="125" rx="21" fill="#efd3bf" stroke="#8a6652" stroke-width="1.5"/>
    </g>

    <rect id="f1" class="finger" x="221" y="230" width="42" height="130" rx="21"/>
    <rect id="f2" class="finger" x="273" y="213" width="42" height="147" rx="21"/>
    <rect id="f3" class="finger" x="325" y="227" width="42" height="133" rx="21"/>
    <rect id="f4" class="finger" x="377" y="255" width="42" height="105" rx="21"/>

    <rect x="218" y="335" width="206" height="130" rx="26" fill="#efd3bf" stroke="#8a6652" stroke-width="1.5"/>
    <rect x="224" y="335" width="194" height="8" fill="#efd3bf"/>

    <g font-size="11" fill="#777" text-anchor="middle">
      <text x="242" y="221">index</text>
      <text x="294" y="204">majeur</text>
      <text x="346" y="218">annulaire</text>
      <text x="398" y="246">auriculaire</text>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <text id="l1" x="242" y="262" fill="#555">1</text>
      <text id="l2" x="294" y="245" fill="#555">2</text>
      <text id="l3" x="346" y="259" fill="#555">3</text>
      <text id="l4" x="398" y="287" fill="#555">4</text>
    </g>
    <text x="150" y="432" font-size="12" fill="#777" text-anchor="middle">pouce</text>
  </svg>

  <div id="step" aria-live="polite"></div>
  <div id="caption" aria-live="polite"></div>

  <section class="panel" aria-label="Rythme">
    <h2>Rythme</h2>

    <p class="lbl">Le doigt change à chaque…</p>
    <div class="notes" id="notes" role="group" aria-label="Valeur de note">
      <button type="button" data-note="ronde" aria-pressed="false">
        <svg viewBox="0 0 28 28" aria-hidden="true"><ellipse cx="14" cy="14" rx="8.5" ry="5.8" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(-15 14 14)"/></svg>
        Ronde<small>4 temps</small>
      </button>
      <button type="button" data-note="blanche" aria-pressed="true" class="active">
        <svg viewBox="0 0 28 28" aria-hidden="true"><ellipse cx="10" cy="21" rx="6.5" ry="4.6" fill="none" stroke="currentColor" stroke-width="2.2" transform="rotate(-20 10 21)"/><line x1="16" y1="19.5" x2="16" y2="4" stroke="currentColor" stroke-width="2"/></svg>
        Blanche<small>2 temps</small>
      </button>
      <button type="button" data-note="noire" aria-pressed="false">
        <svg viewBox="0 0 28 28" aria-hidden="true"><ellipse cx="10" cy="21" rx="6.5" ry="4.6" fill="currentColor" transform="rotate(-20 10 21)"/><line x1="16" y1="19.5" x2="16" y2="4" stroke="currentColor" stroke-width="2"/></svg>
        Noire<small>1 temps</small>
      </button>
      <button type="button" data-note="croche" aria-pressed="false">
        <svg viewBox="0 0 28 28" aria-hidden="true"><ellipse cx="10" cy="21" rx="6.5" ry="4.6" fill="currentColor" transform="rotate(-20 10 21)"/><line x1="16" y1="19.5" x2="16" y2="4" stroke="currentColor" stroke-width="2"/><path d="M16 4 C16 11 24 11 22.5 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        Croche<small>1/2 temps</small>
      </button>
    </div>

    <p class="lbl">Tempo</p>
    <div class="tempo">
      <button id="bpm-minus" type="button" aria-label="Ralentir">&minus;</button>
      <input id="bpm" type="range" min="40" max="160" step="1" value="80" aria-label="Tempo en battements par minute">
      <button id="bpm-plus" type="button" aria-label="Accélérer">+</button>
      <span id="bpmv">80 BPM</span>
    </div>

    <p class="lbl">Son</p>
    <div class="modes" id="sounds" role="group" aria-label="Son">
      <button type="button" data-sound="metronome" aria-pressed="true" class="active">Métronome</button>
      <button type="button" data-sound="drums" aria-pressed="false">Batterie</button>
      <button type="button" data-sound="mute" aria-pressed="false">Muet</button>
    </div>

    <p class="lbl">Mesure à 4 temps</p>
    <div class="pips" id="pips" aria-hidden="true"></div>
    <div id="rinfo" aria-live="polite"></div>
    <div class="row">
      <button id="play" type="button" class="main">Démarrer le rythme</button>
    </div>
  </section>

  <div class="row">
    <button id="prev" type="button">Précédent</button>
    <button id="next" type="button">Suivant</button>
    <button id="auto" type="button" class="main">Pause</button>
  </div>
</main>

<script>
(function () {
  var Y = [60, 80, 100];
  var X = { 1: 304, 3: 564 };
  var COL = { 1: '#534AB7', 3: '#0F6E56' };
  var NAME = { 1: 'index', 3: 'annulaire' };
  var FRET = { 1: 2, 3: 4 };
  var BASE_W = [2.6, 2.2, 1.8];
  var DIR_FWD = 'à l’endroit';
  var DIR_REV = 'à l’envers';

  var NOTES = {
    ronde:   { ticks: 8, beats: 4,   label: 'Ronde',   text: '4 temps' },
    blanche: { ticks: 4, beats: 2,   label: 'Blanche', text: '2 temps' },
    noire:   { ticks: 2, beats: 1,   label: 'Noire',   text: '1 temps' },
    croche:  { ticks: 1, beats: 0.5, label: 'Croche',  text: '1/2 temps' }
  };

  var FWD = [];
  for (var s = 0; s < 3; s++) { FWD.push({ s: s, f: 1 }); FWD.push({ s: s, f: 3 }); }
  var REV = FWD.slice().reverse();

  function tag(list, dir) {
    return list.map(function (o) { return { s: o.s, f: o.f, dir: dir }; });
  }

  function build(mode) {
    if (mode === 'forward') return tag(FWD, DIR_FWD);
    if (mode === 'reverse') return tag(REV, DIR_REV);
    return tag(FWD, DIR_FWD).concat(tag(REV.slice(1, REV.length - 1), DIR_REV));
  }

  var mode = 'both';
  var steps = build(mode);
  var advanced = false;

  var app = document.getElementById('app');
  var dot = document.getElementById('dot');
  var dot1 = document.getElementById('dot1');
  var dc = document.getElementById('dc');
  var dt = document.getElementById('dt');
  var stepEl = document.getElementById('step');
  var cap = document.getElementById('caption');
  var autoBtn = document.getElementById('auto');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var advBtn = document.getElementById('adv');
  var modeBtns = {
    forward: document.getElementById('m-forward'),
    reverse: document.getElementById('m-reverse'),
    both: document.getElementById('m-both')
  };

  var idx = 0, auto = true, tPlace = null, tAuto = null, shown = null;

  /* ---------- rythme ---------- */
  var noteKey = 'blanche';
  var bpm = 80;
  var sound = 'metronome';
  var playing = false;
  var ctx = null, master = null, session = null, noiseBuf = null;
  var tickCount = 0, nextTime = 0, queue = [], timerSched = null, raf = null;

  var playBtn = document.getElementById('play');
  var bpmInput = document.getElementById('bpm');
  var bpmVal = document.getElementById('bpmv');
  var rinfo = document.getElementById('rinfo');
  var pipsEl = document.getElementById('pips');
  var pips = [];
  var PIP_LABELS = ['1', 'et', '2', 'et', '3', 'et', '4', 'et'];
  for (var p = 0; p < 8; p++) {
    var pe = document.createElement('div');
    pe.className = 'pip ' + (p % 2 === 0 ? 'b' : 'o') + (p === 0 ? ' first' : '');
    pe.textContent = PIP_LABELS[p];
    pipsEl.appendChild(pe);
    pips.push(pe);
  }

  function clock() {
    return ctx ? ctx.currentTime : performance.now() / 1000;
  }

  function ensureCtx() {
    if (ctx) {
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.8;
    master.connect(ctx.destination);
    var len = ctx.sampleRate;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
  }

  function playClick(t, accent, soft) {
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = accent ? 1600 : (soft ? 900 : 1150);
    var peak = accent ? 0.9 : (soft ? 0.25 : 0.55);
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g);
    g.connect(session);
    o.start(t);
    o.stop(t + 0.07);
  }

  function playKick(t) {
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g);
    g.connect(session);
    o.start(t);
    o.stop(t + 0.32);
  }

  function noiseHit(t, freq, type, vol, dur) {
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    var f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    var g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(session);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  function playSnare(t) {
    noiseHit(t, 1200, 'highpass', 0.6, 0.18);
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = 190;
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(g);
    g.connect(session);
    o.start(t);
    o.stop(t + 0.12);
  }

  function playHat(t, vol) {
    noiseHit(t, 7000, 'highpass', vol, 0.05);
  }

  function scheduleSound(k, t) {
    if (!ctx || !session || sound === 'mute') return;
    var e = k % 8;
    var onBeat = (e % 2 === 0);
    if (sound === 'metronome') {
      if (onBeat) playClick(t, e === 0, false);
      else if (NOTES[noteKey].ticks === 1) playClick(t, false, true);
    } else {
      playHat(t, onBeat ? 0.35 : 0.18);
      if (e === 0 || e === 4) playKick(t);
      if (e === 2 || e === 6) playSnare(t);
    }
  }

  function scheduler() {
    while (nextTime < clock() + 0.12) {
      var k = tickCount++;
      scheduleSound(k, nextTime);
      queue.push({ t: nextTime, k: k });
      nextTime += 30 / bpm;
    }
  }

  function showPip(e) {
    for (var i = 0; i < pips.length; i++) pips[i].classList.toggle('on', i === e);
  }

  function onTick(k) {
    showPip(k % 8);
    var n = NOTES[noteKey].ticks;
    if (k % n === 0) {
      go(Math.floor(k / n) % steps.length, true);
    }
  }

  function frame() {
    var lat = (ctx && ctx.outputLatency) ? ctx.outputLatency : 0;
    var now = clock() - lat;
    while (queue.length && queue[0].t <= now) {
      onTick(queue.shift().k);
    }
    if (playing) raf = requestAnimationFrame(frame);
  }

  function updateInfo() {
    var n = NOTES[noteKey];
    var secs = (n.beats * 60 / bpm).toFixed(2).replace('.', ',');
    rinfo.textContent = n.label + ' = ' + n.text + ' · à ' + bpm + ' BPM, le doigt change toutes les ' + secs + ' s';
    bpmVal.textContent = bpm + ' BPM';
  }

  function setNavDisabled(on) {
    prevBtn.disabled = on;
    nextBtn.disabled = on;
    autoBtn.disabled = on;
  }

  function startPlay() {
    ensureCtx();
    playing = true;
    clearTimeout(tAuto);
    clearTimeout(tPlace);
    if (ctx) {
      session = ctx.createGain();
      session.gain.value = 1;
      session.connect(master);
    }
    tickCount = 0;
    queue = [];
    nextTime = clock() + 0.15;
    timerSched = setInterval(scheduler, 25);
    scheduler();
    raf = requestAnimationFrame(frame);
    playBtn.textContent = 'Arrêter le rythme';
    app.classList.add('rhythm');
    setNavDisabled(true);
  }

  function stopPlay() {
    playing = false;
    clearInterval(timerSched);
    cancelAnimationFrame(raf);
    queue = [];
    if (session) {
      try { session.disconnect(); } catch (e) {}
      session = null;
    }
    showPip(-1);
    playBtn.textContent = 'Démarrer le rythme';
    app.classList.remove('rhythm');
    setNavDisabled(false);
    schedule();
  }

  function restartPlay() {
    if (playing) { stopPlay(); startPlay(); }
  }

  playBtn.addEventListener('click', function () {
    if (playing) stopPlay(); else startPlay();
  });

  var noteBtns = document.querySelectorAll('#notes button');
  Array.prototype.forEach.call(noteBtns, function (b) {
    b.addEventListener('click', function () {
      noteKey = b.getAttribute('data-note');
      Array.prototype.forEach.call(noteBtns, function (o) {
        var on = (o === b);
        o.classList.toggle('active', on);
        o.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      updateInfo();
      restartPlay();
    });
  });

  var soundBtns = document.querySelectorAll('#sounds button');
  Array.prototype.forEach.call(soundBtns, function (b) {
    b.addEventListener('click', function () {
      sound = b.getAttribute('data-sound');
      Array.prototype.forEach.call(soundBtns, function (o) {
        var on = (o === b);
        o.classList.toggle('active', on);
        o.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
  });

  function setBpm(v) {
    bpm = Math.max(40, Math.min(160, Math.round(v)));
    bpmInput.value = String(bpm);
    updateInfo();
  }
  bpmInput.addEventListener('input', function () { setBpm(parseFloat(bpmInput.value)); });
  document.getElementById('bpm-minus').addEventListener('click', function () { setBpm(bpm - 1); });
  document.getElementById('bpm-plus').addEventListener('click', function () { setBpm(bpm + 1); });

  /* ---------- animation des doigts ---------- */
  function setStrings(active, color) {
    for (var i = 0; i < 3; i++) {
      var el = document.getElementById('s' + i);
      if (i === active) { el.setAttribute('stroke', color); el.setAttribute('stroke-width', BASE_W[i] + 1.2); }
      else { el.setAttribute('stroke', '#444'); el.setAttribute('stroke-width', BASE_W[i]); }
    }
  }

  function lightFinger(f, held) {
    for (var k = 1; k <= 4; k++) {
      var el = document.getElementById('f' + k);
      var lb = document.getElementById('l' + k);
      el.classList.remove('lit');
      el.classList.remove('held');
      lb.setAttribute('fill', '#555');
      if (k === f) {
        el.style.setProperty('--c', COL[f]);
        el.classList.add('lit');
        lb.setAttribute('fill', '#fff');
      } else if (held && k === 1) {
        el.classList.add('held');
        lb.setAttribute('fill', '#3C3489');
      }
    }
  }

  function schedule() {
    clearTimeout(tAuto);
    if (auto && !playing) tAuto = setTimeout(function () { go((idx + 1) % steps.length); }, 3200);
  }

  function go(i, instant) {
    clearTimeout(tPlace);
    var prev = shown;
    idx = i;
    var st = steps[idx];
    var held = advanced && st.dir === DIR_FWD && st.f === 3;
    var keep = held && prev && prev.s === st.s && prev.f === 1;

    stepEl.textContent = 'Étape ' + (idx + 1) + ' sur ' + steps.length + ' · ' + st.dir + (advanced ? ' · mode avancé' : '');
    cap.style.color = COL[st.f];
    cap.textContent = 'Corde ' + (6 - st.s) + ' : doigt ' + st.f + ' (' + NAME[st.f] + ') dans la case ' + FRET[st.f] +
      (held ? ' — le doigt 1 reste posé en case 2' : '');
    setStrings(st.s, COL[st.f]);
    lightFinger(st.f, held);

    if (instant) {
      dot.style.transition = 'none';
      dot1.style.transition = 'none';
      dc.setAttribute('fill', COL[st.f]);
      dt.textContent = String(st.f);
      dot.setAttribute('transform', 'translate(' + X[st.f] + ',' + Y[st.s] + ')');
      dot.style.opacity = '1';
      if (held) {
        dot1.setAttribute('transform', 'translate(' + X[1] + ',' + Y[st.s] + ')');
        dot1.style.opacity = '1';
      } else {
        dot1.style.opacity = '0';
      }
      void dot.getBoundingClientRect();
      dot.style.transition = '';
      dot1.style.transition = '';
    } else {
      dot.style.opacity = '0';
      if (held) {
        dot1.setAttribute('transform', 'translate(' + X[1] + ',' + Y[st.s] + ')');
        if (keep) {
          dot1.style.transition = 'none';
          dot1.style.opacity = '1';
          void dot1.getBoundingClientRect();
          dot1.style.transition = '';
        } else {
          dot1.style.opacity = '0';
        }
      } else {
        dot1.style.opacity = '0';
      }
      tPlace = setTimeout(function () {
        dc.setAttribute('fill', COL[st.f]);
        dt.textContent = String(st.f);
        dot.setAttribute('transform', 'translate(' + X[st.f] + ',' + Y[st.s] + ')');
        dot.style.opacity = '1';
        if (held && !keep) dot1.style.opacity = '1';
      }, 280);
    }

    shown = { s: st.s, f: st.f, held: held };
    schedule();
  }

  function setAuto(on) {
    auto = on;
    autoBtn.textContent = on ? 'Pause' : 'Lecture automatique';
    schedule();
  }

  function setMode(m) {
    mode = m;
    steps = build(m);
    shown = null;
    for (var k in modeBtns) {
      var on = (k === m);
      modeBtns[k].classList.toggle('active', on);
      modeBtns[k].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    go(0, playing);
    restartPlay();
  }

  function setAdvanced(on) {
    advanced = on;
    advBtn.classList.toggle('active', on);
    advBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    shown = null;
    go(idx, playing);
  }

  modeBtns.forward.addEventListener('click', function () { setMode('forward'); });
  modeBtns.reverse.addEventListener('click', function () { setMode('reverse'); });
  modeBtns.both.addEventListener('click', function () { setMode('both'); });
  advBtn.addEventListener('click', function () { setAdvanced(!advanced); });

  nextBtn.addEventListener('click', function () { setAuto(false); go((idx + 1) % steps.length); });
  prevBtn.addEventListener('click', function () { setAuto(false); go((idx + steps.length - 1) % steps.length); });
  autoBtn.addEventListener('click', function () { setAuto(!auto); });

  updateInfo();
  go(0);
})();
</script>
</body>
</html>
