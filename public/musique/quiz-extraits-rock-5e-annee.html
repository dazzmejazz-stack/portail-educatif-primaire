<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz avec extraits &#8211; Le rock</title>
<style>
:root{--bg:#f2eeee;--card:#fff;--fg:#2b1d17;--muted:#6e5a50;--accent:#b34a1e;--soft:#f3d9cc;--line:#ddd0ca;--ok:#d8efd6;--okb:#2f8a3a;--no:#f6d5d0;--nob:#c0392b}

body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.35;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:6px;margin-bottom:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
h1{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.q{font-size:1.45rem;font-weight:700;line-height:1.2;margin:0 0 16px}
.a{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;min-height:48px;cursor:pointer}
.a:hover:not(:disabled){border-color:var(--accent)}.a:focus-visible,.nx:focus-visible,.listen:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.a.ok{background:var(--ok);border-color:var(--okb)}.a.no{background:var(--no);border-color:var(--nob)}
.fb{background:var(--soft);border-radius:12px;padding:12px;margin:6px 0 12px;font-size:1rem}
.nx{display:block;width:100%;text-align:center;font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:12px;padding:14px;cursor:pointer}
.listen{display:inline-block;margin:0 0 12px;font-weight:600;font-size:.9rem;color:var(--accent);text-decoration:none;border:2px solid var(--accent);border-radius:10px;padding:6px 12px}
.end{text-align:center}.big{font-size:3rem;font-weight:800;color:var(--accent);margin:8px 0}
.snd{font:inherit;font-size:.85rem;color:var(--muted);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer}.snd:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{font:inherit;font-weight:600;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;margin:0 6px 8px 0;min-height:44px}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lbl{color:var(--muted);margin:0 0 6px;font-size:.95rem}
.sb{display:grid;gap:6px;margin:0 0 10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}.tm{border-radius:12px;padding:5px 4px;text-align:center;color:#fff;font-weight:700}.tm b{display:block;font-size:1.5rem;line-height:1.05}.tm small{font-weight:600}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}.tm.pop{animation:pop .6s ease}
.tm.win{outline:4px solid var(--fg);outline-offset:2px}.pm{display:flex;gap:6px;justify-content:center;margin-top:4px}.pm button{font:inherit;font-size:1.05rem;font-weight:700;color:#fff;background:rgba(0,0,0,.28);border:0;border-radius:8px;min-width:40px;min-height:32px;cursor:pointer}
.bz{display:grid;gap:8px;margin:0 0 12px}.bzb{font:inherit;font-weight:800;font-size:1.05rem;color:#fff;border:0;border-radius:14px;padding:22px 4px;cursor:pointer;touch-action:manipulation}.bzb:disabled{opacity:.35}.bzb.first{opacity:1;outline:4px solid var(--fg);outline-offset:2px}

.a:disabled{opacity:.55;cursor:default}.a.ok:disabled,.a.no:disabled{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="start">
    <h1>Le rock</h1>
    <p class="q">Quiz avec extraits</p>
    <p class="lbl">Jouer avec des équipes (buzzer et points) ?</p>
    <div id="teams"><button type="button" class="chip on" data-t="0">Sans équipes</button><button type="button" class="chip" data-t="2">2 équipes</button><button type="button" class="chip" data-t="3">3 équipes</button><button type="button" class="chip" data-t="4">4 équipes</button><button type="button" class="chip" data-t="5">5 équipes</button><button type="button" class="chip" data-t="6">6 équipes</button></div>
    <p class="lbl" style="margin-top:8px">Décompte avant le buzz (temps pour lire la question) :</p>
    <div id="cds"><button type="button" class="chip cdc" data-c="0">Sans décompte</button><button type="button" class="chip cdc on" data-c="5">5 secondes</button><button type="button" class="chip cdc" data-c="10">10 secondes</button></div>
    <p class="lbl" style="margin:0 0 8px;font-size:.85rem">Points : 2 pour une bonne réponse du premier coup, 1 en réplique.</p>
    <p class="lbl" style="margin-top:8px">Choisis la longueur de la partie.</p>
    <button class="a mode" type="button" data-n="10"><b>Court : 10 questions</b><br><small>environ 10 minutes</small></button>
    <button class="a mode" type="button" data-n="20"><b>Moyen : 20 questions</b><br><small>environ 20 minutes</small></button>
    <button class="a mode" type="button" data-n="40"><b>Long : 40 questions</b><br><small>environ 40 minutes</small></button>
  </div>
  <div id="game" hidden>
    <div class="sb" id="sb" hidden></div>
    <div class="top"><span id="num"></span><button type="button" id="snd" class="snd" aria-pressed="true">&#128266; Sons : oui</button><span id="score"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <h1>Le rock</h1>
    <p class="q" id="q"></p>
    <div id="players"></div>
    <div class="bz" id="bz" hidden></div>
    <div class="ban" id="ban" hidden></div>
    <button class="skip" id="skip" type="button" hidden>Personne n’a buzzé : voir la réponse</button>
    <div id="answers"></div>
    <div class="fb" id="fb" hidden></div>
    <button class="nx" id="next" type="button" hidden>Question suivante &#8594;</button>
  </div>
  <div class="end" id="end" hidden>
    <h1>Le rock</h1>
    <p class="q">Quiz termin&#233; !</p>
    <div class="big" id="final"></div>
    <p id="msg"></p>
    <button class="nx" id="again" type="button">Rejouer</button>
  </div>
</div>

  var q=Q[i];$("num").textContent="Question "+(i+1)+" / "+Q.length;$("score").textContent=T?"":"Score : "+score;
  $("prog").style.width=(i/Q.length*100)+"%";$("q").textContent=q.t;
  players.forEach(function(a,k){a.pause();a.style.display=(q.au===k)?"block":"none"});if(q.au!==undefined){try{players[q.au].currentTime=pickSeg(q.au)}catch(e){}}
  $("fb").hidden=true;$("next").hidden=true;var box=$("answers");box.innerHTML="";
  shuffle(q.opts).forEach(function(o){var b=document.createElement("button");b.type="button";b.className="a";b.textContent=o;b.addEventListener("click",function(){pick(b,o)});box.appendChild(b);if(T)b.disabled=true});
  buz=-1;rp=0;lock=-1;renderBZ();startCD();
}
function pick(b,o){
  var q=Q[i],good=o===q.ok;
  if(T&&!good&&!rp&&buz>=0){sfx(false);b.classList.add("no");b.textContent="✘ "+o;b.dataset.w="1";rp=1;lock=buz;buz=-1;
    Array.prototype.forEach.call($("answers").children,function(x){x.disabled=true});
    Array.prototype.forEach.call($("bz").children,function(x,j){x.classList.remove("first");x.disabled=(j===lock)});
    var bn=$("ban");bn.textContent="✘ Équipe "+(lock+1)+" s’est trompée. Droit de réplique : les autres équipes peuvent buzzer !";bn.style.background="#444";bn.hidden=false;$("skip").hidden=false;return}
  if(good){score++;if(T&&buz>=0){TS[buz]+=rp?1:2;gain=buz;renderSB();gain=-1}}if(T)Array.prototype.forEach.call($("bz").children,function(x){x.disabled=true});sfx(good);
  Array.prototype.forEach.call($("answers").children,function(x){x.disabled=true;if(x.textContent===q.ok){x.classList.add("ok");if(x===b)x.textContent="✔ "+x.textContent}});
  if(!good){b.classList.add("no");b.textContent="✘ "+o}
  var dd=good?"":describe(o);var pre=T&&buz>=0?(good?"Bravo ! +"+(rp?"1 point":"2 points")+" pour l’équipe "+(buz+1)+(rp?" (réplique)":"")+". ":"Pas tout à fait (0 point pour l’équipe "+(buz+1)+"). La bonne réponse : "+q.ok+". "):(good?"Bravo ! ":"Pas tout à fait. La bonne réponse : "+q.ok+". ");$("fb").textContent=pre+q.fb+(dd?" Ton choix, « "+o+" » → "+dd:"");$("fb").hidden=false;
  $("score").textContent=T?"":"Score : "+score;$("next").textContent=i===Q.length-1?"Voir mon résultat":"Question suivante →";$("next").hidden=false;$("next").focus();
}
$("next").addEventListener("click",function(){i++;if(i>=Q.length){end()}else{show()}});
function end(){stopCD();players.forEach(function(a){a.pause()});$("game").hidden=true;$("end").hidden=false;var p=score/Q.length;if(T){var mx=Math.max.apply(null,TS),w=[];TS.forEach(function(v,k){if(v===mx)w.push(k+1)});$("final").textContent=w.length>1?"Égalité !":"🏆 Équipe "+w[0];$("msg").textContent=TS.map(function(v,k){return "Équipe "+(k+1)+" : "+v}).join(" · ");$("sb").hidden=true;return}
  $("final").textContent=score+" / "+Q.length;
  $("msg").textContent=p>=0.9?"Excellent ! Tu connais bien le rock.":p>=0.6?"Bien joué ! Encore un essai pour faire mieux ?":"Réécoute les extraits et réessaie !"}
$("again").addEventListener("click",function(){stopCD();players.forEach(function(a){a.pause()});$("end").hidden=true;$("start").hidden=false});
Array.prototype.forEach.call(document.querySelectorAll(".mode"),function(b){b.addEventListener("click",function(){start(parseInt(b.getAttribute("data-n"),10))})});
</script>
