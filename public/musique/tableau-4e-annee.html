<!doctype html>

<head>
<meta charset="utf-8">

<title>Tableau d&#8217;&#233;coute 4e ann&#233;e</title>
<style>
@page { size: letter landscape; margin: 12mm; }
:root { --bg:#f2eeee; --card:#fff; --fg:#2b1d17; --muted:#6e5a50; --accent:#b34a1e; --soft:#f3d9cc; --line:#c9b3a8; }
@media (prefers-color-scheme: dark) { :root { --bg:#1d1411; --card:#2a1d18; --fg:#f4e9e4; --muted:#c4aea3; --accent:#f08a5d; --soft:#43291f; --line:#6a4a3c; } }
@media print { :root { --bg:#fff; --card:#fff; --fg:#000; --muted:#333; --accent:#000; --soft:#eee; --line:#666; } .actions, .listen { display:none; } }
body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.35; padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px)); }
.wrap { max-width:1250px; margin:0 auto; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:12px; margin-bottom:16px; }
h1 { font-size:clamp(1.7rem,5vw,2.4rem); margin:0; line-height:1.1; }
.sub { margin:4px 0 0; color:var(--muted); }
.btn { font:inherit; font-weight:600; color:var(--accent); background:transparent; border:2px solid var(--accent); border-radius:10px; padding:8px 14px; min-height:44px; cursor:pointer; }
.btn:hover { background:var(--soft); }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
.scroll { overflow-x:auto; }
table { width:100%; min-width:760px; border-collapse:collapse; background:var(--card); border:2px solid var(--line); table-layout:fixed; }
th, td { border:2px solid var(--line); padding:8px; text-align:center; vertical-align:middle; }
thead th { background:var(--soft); font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); padding:10px; }
th.num { width:110px; }
tbody th { background:var(--soft); font-weight:700; color:var(--accent); }
.listen { display:inline-block; margin-top:4px; font-size:0.8rem; font-weight:600; color:var(--accent); text-decoration:none; }
.listen:hover { text-decoration:underline; }
td { height:84px; padding:0; }
.cell { font:inherit; color:inherit; width:100%; height:100%; min-height:84px; background:transparent; border:0; cursor:pointer; padding:8px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; font-size:0.95rem; line-height:1.2; }
.cell:hover { background:var(--soft); }
.cell:focus-visible, .btn:focus-visible, .listen:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; }
.cell .ans { display:none; }
.cell.open .ans { display:inline-flex; }
.cell.open { background:var(--soft); }
.stack { display:flex; flex-direction:column; align-items:center; gap:4px; }
h2 { font-size:1.1rem; margin:28px 0 10px; }
.bank { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
.bank section { min-width:0; }
.bank h3 { margin:0 0 8px; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
.chips { display:flex; flex-direction:column; gap:8px; }
.chip { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:8px 10px; min-height:40px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; font-size:0.9rem; overflow-wrap:anywhere; }
</style>
<style>body{padding-top:64px!important}@media (prefers-color-scheme:dark){#btn-accueil{background:#222!important;color:#fff!important;border-color:#aaa!important}}</style><style id="theme4">
@media screen{
:root:root{--bg:#13243d;--card:#1d3558;--fg:#fdf3dc;--muted:#cdbf9c;--accent:#f6c75b;--accent-soft:#2c4a78;--soft:#2c4a78;--line:#d9a441;color-scheme:dark}
body{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><path d='M30 4l6 14 14-6-6 14 14 6-14 6 6 14-14-6-6 14-6-14-14 6 6-14-14-6 14-6-6-14 14 6z' fill='none' stroke='%23d9a441' stroke-opacity='.16' stroke-width='1.5'/></svg>")}
h1{color:#f6c75b}
}
.scenes4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 20px}
.scenes4 figure{margin:0;position:relative;border:2px solid #d9a441;border-radius:16px;overflow:hidden}
.scenes4 svg{display:block;width:100%;height:auto}
.scenes4 figcaption{position:absolute;left:8px;bottom:6px;background:#000a;color:#fdf3dc;border-radius:999px;padding:3px 10px;font:800 13px system-ui,sans-serif}
@media (max-width:480px){.scenes4 figcaption{font-size:11px;padding:2px 8px}}
@media print{.scenes4{display:none}}
</style></head>
<body><a id="btn-accueil" href="https://portail-educatif-primaire.vercel.app/" style="position:fixed;top:10px;left:10px;z-index:9999;background:#fff;color:#222;border:2px solid #555;border-radius:999px;padding:8px 14px;font:700 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)">🏠 Accueil</a>
<div class="wrap">
  <header>
    <div>
      <h1>Tableau d&#8217;&#233;coute 4e ann&#233;e</h1>
      <p class="sub">&#201;coute chaque extrait, puis place les bonnes r&#233;ponses dans les cases.</p>
    </div>
    <div class="actions">
      <button class="btn" id="show" type="button">Tout r&#233;v&#233;ler</button>
      <button class="btn" id="hide" type="button">Tout cacher</button>
    </div>
  </header>
  <div class="scenes4" aria-hidden="true">
<figure><svg viewBox="0 0 360 150"><defs><linearGradient id="s4a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d1a1a"/><stop offset="1" stop-color="#e8704a"/></linearGradient></defs><rect width="360" height="150" fill="url(#s4a)"/><circle cx="290" cy="40" r="22" fill="#ffe9b0"/><g fill="#2b0d0d"><path d="M0 130 Q60 100 120 125 T240 120 T360 125 V150 H0z"/><rect x="150" y="100" width="60" height="30"/><path d="M140 100 L180 86 L220 100 Z"/><rect x="156" y="72" width="48" height="14"/><path d="M148 72 L180 60 L212 72 Z"/><rect x="162" y="46" width="36" height="12"/><path d="M156 46 L180 36 L204 46 Z"/><rect x="178" y="22" width="4" height="16"/></g><g fill="#ffb7c5"><circle cx="40" cy="60" r="6"/><circle cx="55" cy="72" r="5"/><circle cx="30" cy="80" r="5"/><circle cx="85" cy="50" r="4"/><circle cx="310" cy="90" r="5"/><circle cx="330" cy="75" r="4"/></g></svg><figcaption>🏯 Asie</figcaption></figure>
<figure><svg viewBox="0 0 360 150"><defs><linearGradient id="s4b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f5e"/><stop offset="1" stop-color="#f0a14a"/></linearGradient></defs><rect width="360" height="150" fill="url(#s4b)"/><path d="M262 20a18 18 0 1 0 14 28a14 14 0 1 1 -14 -28z" fill="#ffe9b0"/><g fill="#fff" opacity=".8"><circle cx="40" cy="25" r="1.5"/><circle cx="90" cy="15" r="1.5"/><circle cx="150" cy="30" r="1.5"/><circle cx="210" cy="12" r="1.5"/></g><path d="M110 120 L165 52 L220 120z" fill="#c98a3a"/><path d="M165 52 L220 120 L165 120z" fill="#a8702a"/><path d="M180 120 L215 76 L250 120z" fill="#c98a3a"/><path d="M0 118 Q70 98 140 120 T290 118 T360 120 V150 H0z" fill="#e8b45a"/><path d="M0 135 Q90 118 180 136 T360 132 V150 H0z" fill="#d49a40"/><g fill="#4a2a0c"><path d="M40 126 q4 -20 14 -22 q2 -10 8 -8 l4 6 q8 0 10 10 l-2 14 h-4 l-1 -12 h-12 l-1 12 h-4 l-1 -12 q-6 6 -11 12z"/></g><g><rect x="318" y="86" width="4" height="40" fill="#5a3a1a"/><path fill="#3a7a2a" d="M320 88 q-22 -8 -28 6 M320 88 q22 -8 28 6 M320 88 q-10 -22 -22 -14 M320 88 q10 -22 22 -14"/></g></svg><figcaption>🪔 Monde arabe</figcaption></figure></div>

  <div class="scroll">
    <table>
      <thead>
        <tr><th class="num"></th><th>Compositeur</th><th>Titre</th><th>Met en lumi&egrave;re&hellip;</th><th>Nous a fait d&eacute;couvrir&hellip;</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2>Les r&#233;ponses</h2>
  <div class="bank" id="bank"></div>
</div>

<script src="liens-4e.js"></script>
<script>
var L4 = window.LIENS4E || {};
var COLS = ["Compositeur", "Titre", "Met en lumière…", "Nous a fait découvrir…"];
var ROWS = [
 {
  "q": "Saint-Saëns Bacchanale Samson et Dalila",
  "url": L4.bacchanale,
  "cells": [
   "Saint-Saëns",
   "Bacchanale de Samson et Dalila",
   "<span class=\"stack\"><span>Ambiance arabe grâce à la gamme mineure harmonique</span></span>",
   "<span class=\"stack\"><span>Comparaison entre la gamme majeure et mineure harmonique</span></span>"
  ]
 },
 {
  "q": "Debussy Pagodes",
  "url": L4.pagodes,
  "cells": [
   "Debussy",
   "Pagodes",
   "<span class=\"stack\"><span>Ambiance asiatique grâce à la gamme pentatonique</span></span>",
   "<span class=\"stack\"><span>Comparaison entre la gamme majeure et pentatonique</span></span>"
  ]
 }
];
var PERM = [1, 0];
function cell(html) {
  var td = document.createElement("td");
  var b = document.createElement("button");
  b.type = "button";
  b.className = "cell";
  b.setAttribute("aria-label", "Révéler la réponse");
  b.innerHTML = '<span class="ans">' + html + "</span>";
  b.addEventListener("click", function () { b.classList.toggle("open"); });
  td.appendChild(b);
  return td;
}
var tb = document.getElementById("rows");
ROWS.forEach(function (r, i) {
  var tr = document.createElement("tr");
  var th = document.createElement("th");
  th.scope = "row";
  th.innerHTML = "Extrait " + (i + 1) + '<br><a class="listen" target="_blank" rel="noopener noreferrer" href="' + (r.url || ('https://www.youtube.com/results?search_query=' + encodeURIComponent(r.q))) + '">Écouter ↗</a>';
  tr.appendChild(th);
  r.cells.forEach(function (c) { tr.appendChild(cell(c)); });
  tb.appendChild(tr);
});
var bank = document.getElementById("bank");
COLS.forEach(function (name, ci) {
  var s = document.createElement("section");
  var h = document.createElement("h3");
  h.textContent = name;
  var c = document.createElement("div");
  c.className = "chips";
  PERM.forEach(function (ri) {
    var d = document.createElement("div");
    d.className = "chip";
    d.innerHTML = ROWS[ri].cells[ci];
    c.appendChild(d);
  });
  s.appendChild(h);
  s.appendChild(c);
  bank.appendChild(s);
});
function setAll(open) {
  document.querySelectorAll(".cell").forEach(function (c) { c.classList.toggle("open", open); });
}
document.getElementById("show").addEventListener("click", function () { setAll(true); });
document.getElementById("hide").addEventListener("click", function () { setAll(false); });
</script>
</body>
