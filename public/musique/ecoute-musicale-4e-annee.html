<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écoute musicale 4e année</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f2eeee;
  --card: #ffffff;
  --fg: #2b1d17;
  --muted: #6e5a50;
  --accent: #b34a1e;
  --accent-soft: #f3d9cc;
  --line: #ddd0ca;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1411; --card: #2a1d18; --fg: #f4e9e4; --muted: #c4aea3;
    --accent: #f08a5d; --accent-soft: #43291f; --line: #553a2f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1411; --card: #2a1d18; --fg: #f4e9e4; --muted: #c4aea3;
  --accent: #f08a5d; --accent-soft: #43291f; --line: #553a2f;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  margin: 0;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1200px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.8rem); line-height: 1.05; margin: 0; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; font-size: 0.95rem;
  color: var(--accent); background: transparent;
  border: 2px solid var(--accent); border-radius: 10px;
  padding: 10px 16px; min-height: 44px; cursor: pointer;
}
.btn:hover { background: var(--accent-soft); }
.btn:focus-visible, .card:focus-visible, .listen:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.board { display: grid; grid-template-columns: 1fr; gap: 28px; }
.extrait { min-width: 0; }
.ex-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--line);
}
.extrait h2 {
  font-family: var(--font-display); font-weight: 600; font-size: 0.85rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0;
}
.listen {
  font-weight: 600; font-size: 0.9rem; color: var(--accent); text-decoration: none;
  border: 2px solid var(--accent); border-radius: 10px; padding: 8px 12px; min-height: 40px;
  display: inline-flex; align-items: center; white-space: nowrap;
}
.listen:hover { background: var(--accent-soft); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.card {
  font: inherit; color: inherit; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-radius: 12px;
  padding: 12px; min-height: 140px; min-width: 0;
  display: flex; flex-direction: column; gap: 10px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, background .15s;
}
.card:hover { border-color: var(--accent); }
.label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.mask {
  flex: 1; border-radius: 8px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; color: var(--accent);
  background: repeating-linear-gradient(135deg, var(--accent-soft) 0 8px, transparent 8px 16px);
}
.answer { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.2; overflow-wrap: anywhere; }
.card .answer-box { display: none; }
.card.open { border-color: var(--accent); background: var(--accent-soft); }
.card.open .mask { display: none; }
.card.open .answer-box { display: flex; flex-direction: column; gap: 6px; flex: 1; justify-content: center; align-items: flex-start; animation: pop .22s ease-out; }

@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card.open .answer-box { animation: none; } }

@media (min-width: 900px) {
  .board { grid-template-columns: repeat(auto-fill, minmax(200px, 250px)); gap: 16px; justify-content: start; }
  .cards { grid-template-columns: 1fr; }
}
</style>
<style>@media (prefers-color-scheme:dark){#btn-accueil{background:#222!important;color:#fff!important;border-color:#aaa!important}}</style><style id="theme4">
@media screen{
:root:root{--bg:#13243d;--card:#1d3558;--fg:#fdf3dc;--muted:#cdbf9c;--accent:#f6c75b;--accent-soft:#2c4a78;--soft:#2c4a78;--line:#d9a441;color-scheme:dark}
body{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><path d='M30 4l6 14 14-6-6 14 14 6-14 6 6 14-14-6-6 14-6-14-14 6 6-14-14-6 14-6-6-14 14 6z' fill='none' stroke='%23d9a441' stroke-opacity='.16' stroke-width='1.5'/></svg>")}
h1{color:#f6c75b}
}
.scenes4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 20px}
.scenes4 figure{margin:0;position:relative;border:2px solid #d9a441;border-radius:16px;overflow:hidden}
.scenes4 svg{display:block;width:100%;height:auto}
.scenes4 figcaption{position:absolute;left:8px;bottom:6px;background:#000a;color:#fdf3dc;border-radius:999px;padding:3px 10px;font:800 13px system-ui,sans-serif}
@media (max-width:480px){.scenes4 figcaption{font-size:11px;padding:2px 8px}}
@media print{.scenes4{display:none}}
</style></head>
<body><a id="btn-accueil" href="https://portail-educatif-primaire.vercel.app/" style="position:fixed;top:10px;left:10px;z-index:9999;background:#fff;color:#222;border:2px solid #555;border-radius:999px;padding:8px 14px;font:700 15px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)">🏠 Accueil</a>

<div class="wrap">
  <header>
    <div>
      <h1>Écoute musicale 4e année</h1>
      <p class="sub">Touche une case pour voir la réponse.</p>
    </div>
    <div class="actions">
      <button class="btn" id="show-all" type="button">Tout révéler</button>
      <button class="btn" id="hide-all" type="button">Tout cacher</button>
    </div>
  </header>
  <div class="scenes4" aria-hidden="true">
<figure><svg viewBox="0 0 360 150"><defs><linearGradient id="s4a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d1a1a"/><stop offset="1" stop-color="#e8704a"/></linearGradient></defs><rect width="360" height="150" fill="url(#s4a)"/><circle cx="290" cy="40" r="22" fill="#ffe9b0"/><g fill="#2b0d0d"><path d="M0 130 Q60 100 120 125 T240 120 T360 125 V150 H0z"/><rect x="150" y="100" width="60" height="30"/><path d="M140 100 L180 86 L220 100 Z"/><rect x="156" y="72" width="48" height="14"/><path d="M148 72 L180 60 L212 72 Z"/><rect x="162" y="46" width="36" height="12"/><path d="M156 46 L180 36 L204 46 Z"/><rect x="178" y="22" width="4" height="16"/></g><g fill="#ffb7c5"><circle cx="40" cy="60" r="6"/><circle cx="55" cy="72" r="5"/><circle cx="30" cy="80" r="5"/><circle cx="85" cy="50" r="4"/><circle cx="310" cy="90" r="5"/><circle cx="330" cy="75" r="4"/></g></svg><figcaption>🏯 Asie</figcaption></figure>
<figure><svg viewBox="0 0 360 150"><defs><linearGradient id="s4b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f5e"/><stop offset="1" stop-color="#f0a14a"/></linearGradient></defs><rect width="360" height="150" fill="url(#s4b)"/><path d="M262 20a18 18 0 1 0 14 28a14 14 0 1 1 -14 -28z" fill="#ffe9b0"/><g fill="#fff" opacity=".8"><circle cx="40" cy="25" r="1.5"/><circle cx="90" cy="15" r="1.5"/><circle cx="150" cy="30" r="1.5"/><circle cx="210" cy="12" r="1.5"/></g><path d="M110 120 L165 52 L220 120z" fill="#c98a3a"/><path d="M165 52 L220 120 L165 120z" fill="#a8702a"/><path d="M180 120 L215 76 L250 120z" fill="#c98a3a"/><path d="M0 118 Q70 98 140 120 T290 118 T360 120 V150 H0z" fill="#e8b45a"/><path d="M0 135 Q90 118 180 136 T360 132 V150 H0z" fill="#d49a40"/><g fill="#4a2a0c"><path d="M40 126 q4 -20 14 -22 q2 -10 8 -8 l4 6 q8 0 10 10 l-2 14 h-4 l-1 -12 h-12 l-1 12 h-4 l-1 -12 q-6 6 -11 12z"/></g><g><rect x="318" y="86" width="4" height="40" fill="#5a3a1a"/><path fill="#3a7a2a" d="M320 88 q-22 -8 -28 6 M320 88 q22 -8 28 6 M320 88 q-10 -22 -22 -14 M320 88 q10 -22 22 -14"/></g></svg><figcaption>🪔 Monde arabe</figcaption></figure></div>
  <main class="board" id="board"></main>
</div>

<script>
var EXTRAITS = [
  {
    q: "Saint-Saëns Bacchanale Samson et Dalila",
    comp: "Saint-Saëns",
    oeuvre: "Bacchanale de Samson et Dalila",
    lumiere: "Ambiance arabe grâce à la gamme mineure harmonique",
    decouvrir: "Comparaison entre la gamme majeure et mineure harmonique"
  },
  {
    q: "Debussy Pagodes",
    comp: "Debussy",
    oeuvre: "Pagodes",
    lumiere: "Ambiance asiatique grâce à la gamme pentatonique",
    decouvrir: "Comparaison entre la gamme majeure et pentatonique"
  }
];

var board = document.getElementById("board");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}

function makeCard(label, answerHtml) {
  var b = document.createElement("button");
  b.type = "button";
  b.className = "card";
  b.setAttribute("aria-expanded", "false");
  b.innerHTML =
    '<span class="label"></span>' +
    '<span class="mask" aria-hidden="true">?</span>' +
    '<span class="answer-box"></span>';
  b.querySelector(".label").textContent = label;
  b.querySelector(".answer-box").innerHTML = answerHtml;
  b.addEventListener("click", function () { toggle(b); });
  return b;
}

function toggle(card, force) {
  var open = typeof force === "boolean" ? force : !card.classList.contains("open");
  card.classList.toggle("open", open);
  card.setAttribute("aria-expanded", open ? "true" : "false");
}

function answer(t) {
  return '<span class="answer">' + esc(t) + "</span>";
}

EXTRAITS.forEach(function (e, i) {
  var sec = document.createElement("section");
  sec.className = "extrait";

  var h = document.createElement("h2");
  h.textContent = "Extrait " + (i + 1);
  var head = document.createElement("div");
  head.className = "ex-head";
  head.appendChild(h);
  var a = document.createElement("a");
  a.className = "listen";
  a.href = e.url || ("https://www.youtube.com/results?search_query=" + encodeURIComponent(e.q));
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = "Écouter ↗";
  head.appendChild(a);

  var cards = document.createElement("div");
  cards.className = "cards";
  cards.appendChild(makeCard("Compositeur", answer(e.comp)));
  cards.appendChild(makeCard("Titre", answer(e.oeuvre)));
  cards.appendChild(makeCard("Met en lumière…", answer(e.lumiere)));
  cards.appendChild(makeCard("Nous a fait découvrir…", answer(e.decouvrir)));

  sec.appendChild(head);
  sec.appendChild(cards);
  board.appendChild(sec);
});

function setAll(open) {
  board.querySelectorAll("button.card").forEach(function (c) { toggle(c, open); });
}
document.getElementById("show-all").addEventListener("click", function () { setAll(true); });
document.getElementById("hide-all").addEventListener("click", function () { setAll(false); });
</script>
</body>
</html>
